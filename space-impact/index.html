const joy=document.getElementById('joy'),knob=joy.firstChild,stage=document.getElementById('stage');
let jx=0,jy=0,jR=1,ox=0,oy=0;
function joyRel(){
if(jid!=null){try{stage.releasePointerCapture(jid)}catch(e){}}
jid=null;jv.x=jv.y=0;
joy.classList.remove('on');
joy.style.left=joy.style.top=joy.style.bottom='';
knob.style.transform='';
}
// Steer from where the thumb landed; the base may be clamped away from the screen edge.
function joyMove(p){
let dx=p.clientX-ox,dy=p.clientY-oy;
const len=Math.hypot(dx,dy)||1,c=Math.min(len,jR);
dx*=c/len;dy*=c/len;
let kx=p.clientX-jx,ky=p.clientY-jy;const kl=Math.hypot(kx,ky)||1,kc=Math.min(kl,jR);
knob.style.transform=`translate(${kx*kc/kl}px,${ky*kc/kl}px)`;
const m=Math.max(0,c/jR-.12)/.88;
jv.x=dx/c*m||0;jv.y=dy/c*m||0;
}
stage.addEventListener('pointerdown',e=>{

if(e.clientX-r.left>r.width*.45)return;
if(st!=='play')startGame();else if(paused)paused=false;
const D=joy.offsetWidth;
jR=(D-knob.offsetWidth)/2;
jx=Math.max(D/2,Math.min(r.width-D/2,e.clientX-r.left))+r.left;
jy=Math.max(D/2,Math.min(r.height-D/2,e.clientY-r.top))+r.top;
joy.style.left=jx-r.left-D/2+'px';joy.style.top=jy-r.top-D/2+'px';joy.style.bottom='auto';
ox=e.clientX;oy=e.clientY;
joy.classList.add('on');
jid=e.pointerId;
try{stage.setPointerCapture(jid)}catch(x){}
joyMove(e);
});

['pointerup','pointercancel','lostpointercapture'].forEach(n=>stage.addEventListener(n,e=>{if(e.pointerId===jid)joyRel()}));
